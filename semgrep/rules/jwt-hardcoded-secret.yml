rules:
  - id: appsec-lab.jwt-hardcoded-secret
    languages: [python]
    severity: ERROR
    message: >-
      La clave de firma JWT está escrita en el código (literal o constante).
      Leerla de una variable de entorno o de un gestor de secretos.
    metadata:
      cwe: "CWE-798"
    pattern-either:
      - pattern: jwt.encode($P, "...", ...)
      - pattern: jwt.decode($T, "...", ...)
